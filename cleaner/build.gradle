plugins {
    id 'com.android.application'
}

android {
    namespace 'it.nascasa.pulizia'
    compileSdk 35

    defaultConfig {
        applicationId 'it.nascasa.pulizia'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Stessa chiave fissa dell'altra app: gli aggiornamenti si installano sopra.
    signingConfigs {
        debug {
            storeFile file('../app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila l'APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nas-casa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: pulizia-apk
          path: cleaner/build/outputs/apk/debug/cleaner-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: home-apk
          path: home/build/outputs/apk/debug/home-debug.apk
          if-no-files-found: error

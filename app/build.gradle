plugins {
    id 'com.android.application'
}

android {
    namespace 'it.nascasa.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'it.nascasa.tv'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Chiave fissa inclusa nel progetto: cosi' ogni nuova versione dell'APK si installa
    // "sopra" la precedente senza dover disinstallare (e senza perdere le impostazioni).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
